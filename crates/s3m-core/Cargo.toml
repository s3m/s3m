[package]
name = "s3m-core"
version.workspace = true
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "Reusable S3 client and streaming engine behind the s3m CLI"
documentation = "https://docs.rs/s3m-core"
homepage = "https://s3m.stream"
repository = "https://github.com/s3m/s3m"
readme = "README.md"
keywords = ["s3", "stream", "upload", "resume", "bucket"]
categories = ["api-bindings", "asynchronous"]
license = "BSD-3-Clause"
edition = "2024"

[lints]
workspace = true

[dependencies]
aead-stream = { version = "0.6.0", features = ["alloc"] }
anyhow = "1"
base64ct = { version = "1.8", features = ["alloc"] }
blake3 = "1"
bytes = "1"
bytesize = "2"
chacha20poly1305 = "0.11.0"
crc32c = "0.6"
crc32fast = "1.5"
futures = "0.3"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
indicatif = "0.18"
jiff = { version = "1.0", default-features = false, features = ["std"] }
log = "0.4"
md5 = "0.8"
percent-encoding = "2.3"
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }
rand = "0.10.4"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
ring = "0.17"
rkyv = { version = "0.8", features = ["bytecheck"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rustls-platform-verifier = "0.7"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize", "serialize"] }
sled = "0.34"
socket2 = "0.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-std",
    "io-util",
    "sync",
    "time",
] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["codec"] }
tower-service = "0.3"
url = "2.5"
zstd = "0.14"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "freebsd"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
mockito = "1.7.2"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false }
