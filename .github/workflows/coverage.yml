---
name: Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Pull RustFS Docker image
        run: docker pull ghcr.io/rustfs/rustfs:1.0.0

      - name: Start RustFS for integration coverage
        id: rustfs
        run: |
          docker rm -f s3m-coverage-rustfs 2>/dev/null || true
          id="$(docker run -d --name s3m-coverage-rustfs \
            -p 9000:9000 \
            -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            ghcr.io/rustfs/rustfs:1.0.0)"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Wait for RustFS readiness
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not become ready in time" >&2
          docker logs s3m-coverage-rustfs || true
          exit 1

      - name: Run unit tests with coverage
        run: cargo test --workspace --verbose -- --nocapture
        env:
          RUST_BACKTRACE: full
          CARGO_INCREMENTAL: 0
          # Absolute: tests run s3m in temp directories, and a relative path would
          # drop profiles there, out of grcov's reach and into the files those
          # tests expect to find empty.
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage-%p-%m.profraw
          RUSTFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off
          RUSTDOCFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off

      - name: Run integration tests with coverage
        run: cargo test --tests -- --test-threads=1
        env:
          RUST_BACKTRACE: full
          CARGO_INCREMENTAL: 0
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage-int-%p-%m.profraw
          RUSTFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off
          RUSTDOCFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          # COMPLIANCE retention cannot be removed through S3. This job owns the
          # service and removes it in "Stop RustFS", so the retained Object Lock
          # tests may run against it (see tests/common/owned_bucket.rs).
          S3M_DISPOSABLE_OBJECT_LOCK_ENDPOINT: http://127.0.0.1:9000
          S3M_DISPOSABLE_OBJECT_LOCK_CONTAINER_ID: ${{ steps.rustfs.outputs.id }}

      - name: Install grcov
        run: if [[ ! -e ~/.cargo/bin/grcov ]]; then cargo install grcov; fi

      - name: Run grcov
        run: grcov . --binary-path target/debug/ -s . -t lcov --branch --ignore-not-existing
          --ignore '../**' --ignore '/*' -o coverage.lcov

      # grcov merged the raw profiles into coverage.lcov. Left in place, the uploaders
      # find them: one per test process, several GB in all (#94).
      - name: Remove raw coverage profiles
        run: find . -name '*.profraw' -not -path './target/*' -delete

      - name: Stop RustFS
        if: always()
        run: docker rm -f s3m-coverage-rustfs 2>/dev/null || true

      # Only coverage.lcov: without disable_search the action also uploads every
      # coverage-like file it finds, and plugins: noop skips its gcov search (#94).
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        timeout-minutes: 10
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.lcov
          disable_search: true
          plugins: noop
          flags: rust

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
