---
name: Test

on:
  workflow_call:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      # Every commit a PR brings in must be signed with a key GitHub verifies
      # (see .github/RELEASING.md). GitHub's own merge and squash commits are
      # verified too. Pushes and workflow_call runs skip this step.
      - name: Verify PR commit signatures
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          unverified=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA?per_page=100" \
            --jq '.commits[] | select(.commit.verification.verified != true) | "\(.sha) \(.commit.verification.reason)"')
          if [[ -n "$unverified" ]]; then
            echo "GitHub could not verify these PR commits:"
            echo "$unverified"
            echo "Sign your commits: https://docs.github.com/en/authentication/managing-commit-signature-verification"
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --workspace

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: test
        run: cargo test --workspace --lib --bins

  test-portable:
    name: Test (Portable)
    strategy:
      matrix:
        os:
          - macOS-latest
          - windows-latest
        rust:
          - stable
    runs-on: ${{ matrix.os }}
    needs:
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: test
        # Keep this list free of RustFS/container-backed tests. Those run in
        # containers.yml on Ubuntu, where Docker and an explicit S3 endpoint
        # are available. In particular, integration_streams includes a live
        # multipart resume path and is intentionally excluded here.
        run: >-
          cargo test --workspace --lib --bins
          --test integration_age_delete_pagination
          --test integration_cli_options
          --test integration_command_options
          --test integration_encryption
          --test integration_filtered_listing
          --test integration_get_version_precedence
          --test integration_json_output
          --test integration_listing_progress
          --test integration_listing_public_api
          --test integration_minio_runtime
          --test integration_multipart
          --test integration_s3_actions
          --test integration_stdin
          --test integration_streaming_retries
          --test integration_upload_options
