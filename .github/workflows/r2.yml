---
name: R2 Upload Checks

# Uploads a few MiB to a dedicated Cloudflare R2 test bucket and deletes them
# again (scripts/r2-check.sh). Runs only where the R2_* secrets exist, so pull
# requests from forks never reach it.
on:
  push:
    branches:
      - main
      - develop
      - sandbox
  workflow_dispatch:

concurrency:
  group: r2-upload-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  r2:
    name: R2 Upload Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Check for R2 credentials
        id: secrets
        run: |
          if [[ -n "$R2_ENDPOINT" && -n "$R2_ACCESS_KEY" && -n "$R2_SECRET_KEY" && -n "$R2_BUCKET" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::R2_* secrets are not set; skipping the R2 checks"
          fi

      - name: Checkout code
        if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        if: steps.secrets.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: steps.secrets.outputs.present == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-r2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-r2-

      - name: Build s3m
        if: steps.secrets.outputs.present == 'true'
        run: cargo build --locked --bin s3m

      - name: Write the s3m config
        if: steps.secrets.outputs.present == 'true'
        run: |
          umask 077
          cat > "$RUNNER_TEMP/s3m-r2.yml" <<EOF
          hosts:
            r2:
              endpoint: "$R2_ENDPOINT"
              region: auto
              access_key: "$R2_ACCESS_KEY"
              secret_key: "$R2_SECRET_KEY"
          EOF

      - name: Run the R2 checks
        if: steps.secrets.outputs.present == 'true'
        run: scripts/r2-check.sh target/debug/s3m "$RUNNER_TEMP/s3m-r2.yml" r2 "$R2_BUCKET"

      - name: Remove the s3m config
        if: always() && steps.secrets.outputs.present == 'true'
        run: rm -f "$RUNNER_TEMP/s3m-r2.yml"
